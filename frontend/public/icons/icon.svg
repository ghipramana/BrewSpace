<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E2723" />
      <stop offset="100%" stop-color="#5D4037" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8DCCB" />
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#795548" />
      <stop offset="100%" stop-color="#3E2723" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#E8DCCB" stroke-width="4" stroke-dasharray="16 12" opacity="0.35" />

  <!-- Cup Group with Shadow -->
  <g filter="url(#glow)">
    <!-- Saucer / Piring Tatakan -->
    <ellipse cx="256" cy="380" rx="170" ry="24" fill="#E8DCCB" opacity="0.9" />
    <ellipse cx="256" cy="376" rx="140" ry="16" fill="#F8F3EA" />

    <!-- Cup Body -->
    <path d="M140 220 C140 340, 180 360, 256 360 C332 360, 372 340, 372 220 Z" fill="url(#cupGrad)" />

    <!-- Cup Handle -->
    <path d="M360 236 C420 236, 420 310, 350 316" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" />

    <!-- Coffee Liquid Surface -->
    <ellipse cx="256" cy="220" rx="116" ry="28" fill="url(#coffeeGrad)" />

    <!-- Latte Art Heart / Leaf Detail -->
    <path d="M256 228 C244 212, 226 216, 226 226 C226 236, 256 244, 256 244 C256 244, 286 236, 286 226 C286 216, 268 212, 256 228 Z" fill="#E8DCCB" opacity="0.9" />

    <!-- Coffee Steam Waves -->
    <path d="M220 170 C210 145, 230 130, 220 105" fill="none" stroke="#E8DCCB" stroke-width="9" stroke-linecap="round" opacity="0.75" />
    <path d="M256 160 C246 135, 266 120, 256 95" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" opacity="0.85" />
    <path d="M292 170 C282 145, 302 130, 292 105" fill="none" stroke="#E8DCCB" stroke-width="9" stroke-linecap="round" opacity="0.75" />
  </g>
</svg>
